name: Build DataAgent images
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        default: latest
env:
  REGISTRY: docker.io
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: dataagent-frontend
            image: oda-frontend
            context: .
            dockerfile: ./dataagent-frontend/Dockerfile
            build_args: ""
          - name: dataagent-backend
            image: oda-backend
            context: .
            dockerfile: ./dataagent-backend/Dockerfile
            build_args: ""
          - name: dataagent-runner
            image: oda-runner
            context: .
            dockerfile: ./dataagent-backend/Dockerfile.runner
            build_args: ""
          - name: dataagent-evals-builtin
            image: oda-evals-builtin
            context: .
            dockerfile: ./tools/dataagent-evals/builtin/Dockerfile
            build_args: ""
          - name: dataagent-evals-deepeval
            image: oda-evals-deepeval
            context: .
            dockerfile: ./tools/dataagent-evals/deepeval/Dockerfile
            build_args: ""


    steps:
      - name: Check Docker Hub secrets
        if: github.event_name != 'pull_request'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_TOKEN" ]; then
            echo "::error::Repository secrets DOCKER_USERNAME and DOCKER_TOKEN must be set"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' && (github.event.inputs.version != 'latest' || github.ref == 'refs/heads/main') }}

      - name: Build
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: ${{ matrix.service.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ runner.os }}-buildx-${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ runner.os }}-buildx-${{ matrix.service.name }},sharing=locked

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ${{ matrix.service.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ runner.os }}-buildx-${{ matrix.service.name }}

      - name: Image digest
        if: github.event_name != 'pull_request'
        run: echo "Image digest ${{ steps.push.outputs.digest }}"

  create-release:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create offline deployment package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          scripts/create-offline-package.sh \
            --namespace "${{ secrets.DOCKER_USERNAME }}" \
            --tag "$VERSION" \
            --output "oda-deployment-${VERSION}.tar.xz" \
            --platform linux/amd64
          sha256sum "oda-deployment-${VERSION}.tar.xz" > "oda-deployment-${VERSION}.tar.xz.sha256"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Create release body
        run: |
          NS="${{ secrets.DOCKER_USERNAME }}"
          {
            echo "## DataAgent v${VERSION}"
            echo ""
            echo "### 离线部署包"
            echo "- \`oda-deployment-${VERSION}.tar.xz\`（xz 解压：\`tar -xJf\`，再执行 \`scripts/load-package-and-start.sh --package .\`）"
            echo "- 校验和：\`oda-deployment-${VERSION}.tar.xz.sha256\`"
            echo ""
            echo "### Docker 镜像"
            echo '```bash'
            echo "docker pull ${NS}/oda-frontend:${VERSION}"
            echo "docker pull ${NS}/oda-backend:${VERSION}"
            echo "docker pull ${NS}/oda-runner:${VERSION}"
            echo '```'
          } > release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          body_path: release_body.md
          files: |
            oda-deployment-${{ env.VERSION }}.tar.xz
            oda-deployment-${{ env.VERSION }}.tar.xz.sha256

  create-latest-release:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: create-latest-release
      cancel-in-progress: true
    permissions:
      contents: write
    env:
      RELEASE_TAG: latest
      IMAGE_TAG: latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create latest offline deployment package
        run: |
          scripts/create-offline-package.sh \
            --namespace "${{ secrets.DOCKER_USERNAME }}" \
            --tag "${IMAGE_TAG}" \
            --output "oda-deployment-${RELEASE_TAG}.tar.xz" \
            --platform linux/amd64
          sha256sum "oda-deployment-${RELEASE_TAG}.tar.xz" > "oda-deployment-${RELEASE_TAG}.tar.xz.sha256"

      - name: Create latest release body
        run: |
          NS="${{ secrets.DOCKER_USERNAME }}"
          {
            echo "## DataAgent ${RELEASE_TAG}"
            echo ""
            echo "Source commit: \`${{ github.sha }}\`"
            echo ""
            echo "### 离线部署包"
            echo "- \`oda-deployment-${RELEASE_TAG}.tar.xz\`（xz 解压：\`tar -xJf\`，再执行 \`scripts/load-package-and-start.sh --package .\`）"
            echo "- 校验和：\`oda-deployment-${RELEASE_TAG}.tar.xz.sha256\`"
            echo ""
            echo "### Docker 镜像"
            echo '```bash'
            echo "docker pull ${NS}/oda-frontend:${IMAGE_TAG}"
            echo "docker pull ${NS}/oda-backend:${IMAGE_TAG}"
            echo "docker pull ${NS}/oda-runner:${IMAGE_TAG}"
            echo '```'
          } > latest_release_body.md

      - name: Reset latest release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            gh release delete "${RELEASE_TAG}" --repo "${REPO}" --cleanup-tag --yes
          fi
          gh api -X DELETE "repos/${REPO}/git/refs/tags/${RELEASE_TAG}" >/dev/null 2>&1 || true

      - name: Create latest release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: DataAgent latest
          target_commitish: ${{ github.sha }}
          body_path: latest_release_body.md
          files: |
            oda-deployment-${{ env.RELEASE_TAG }}.tar.xz
            oda-deployment-${{ env.RELEASE_TAG }}.tar.xz.sha256

  summary:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Create summary
        run: |
          NS="${{ secrets.DOCKER_USERNAME }}"
          {
            echo "## Docker images pushed"
            for image in oda-frontend oda-backend oda-runner oda-evals-builtin oda-evals-deepeval; do
              echo "- \`${NS}/${image}\`"
            done
            echo ""
            echo "Platforms: linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"
