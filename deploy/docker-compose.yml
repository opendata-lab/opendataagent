# 固定项目名：与 opendataworks 的 deploy/ 目录同名，不固定会被 Compose 当成同一项目，
# 共用 deploy_mysql-data 等卷并互相识别为孤儿容器。
name: opendataagent

services:
  redis:
    image: redis:7.2-alpine
    container_name: dataagent-redis
    restart: always
    command:
    - redis-server
    - --appendonly
    - 'yes'
    ports:
    - 6389:6379
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
  dataagent-backend:
    image: ${ODA_BACKEND_IMAGE:-mikefan2019/oda-backend:latest}
    container_name: dataagent-backend
    restart: always
    env_file:
    - ./.env
    user: "0:0"
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-127.0.0.1}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-${DATAAGENT_MYSQL_USER:-dataagent}}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-${DATAAGENT_MYSQL_PASSWORD:-dataagent123}}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-${DATAAGENT_SESSION_MYSQL_DATABASE:-dataagent}}
      SESSION_MYSQL_DATABASE: ${MYSQL_DATABASE:-${DATAAGENT_SESSION_MYSQL_DATABASE:-dataagent}}
      SKILLS_ROOT_DIR: /app/.claude/skills
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      DATAAGENT_SANDBOX_IMAGE: ${ODA_SANDBOX_IMAGE:-mikefan2019/oda-sandbox:latest}
      DATAAGENT_RUNTIME_UID: ${DATAAGENT_RUNTIME_UID:-1000}
      DATAAGENT_RUNTIME_GID: ${DATAAGENT_RUNTIME_GID:-1000}
      DATAAGENT_CONFIG: /app/docker/dataagent/dataagent_config.py
    ports:
    - 8900:8900
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8900/api/v1/nl2sql/health').read()
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
    - ${DATAAGENT_HOST_ROOT:-/dataagent_runtime}:/dataagent_runtime
    - ./docker/dataagent:/app/docker/dataagent:ro
    - dataagent-skills:/app/.claude/skills
    - ${DATAAGENT_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
  dataagent-frontend:
    image: ${ODA_FRONTEND_IMAGE:-mikefan2019/oda-frontend:latest}
    container_name: dataagent-frontend
    restart: always
    ports:
    - 8901:80
    volumes:
    - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      dataagent-backend:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      # 127.0.0.1, not localhost: busybox wget tries ::1 first and nginx listens on IPv4.
      - http://127.0.0.1/
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  dataagent-skills:
    driver: local
